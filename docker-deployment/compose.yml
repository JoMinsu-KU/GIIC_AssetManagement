name: ${COMPOSE_PROJECT_NAME:-giic_asset}

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asset_management}
      MYSQL_USER: ${MYSQL_USER:-asset_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3907}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups:/backups
      - ../DB/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../DB/init/02_schema_update.sql:/docker-entrypoint-initdb.d/02_schema_update.sql:ro
      - ../DB/init/03_transfer_update.sql:/docker-entrypoint-initdb.d/03_transfer_update.sql:ro
      - ../DB/init/04_transfer_cleanup.sql:/docker-entrypoint-initdb.d/04_transfer_cleanup.sql:ro
      - ../DB/init/05_asset_status_update.sql:/docker-entrypoint-initdb.d/05_asset_status_update.sql:ro
      - ../DB/init/06_maintenance_type_update.sql:/docker-entrypoint-initdb.d/06_maintenance_type_update.sql:ro
      - ../DB/init/07_asset_status_disposal_pending.sql:/docker-entrypoint-initdb.d/07_asset_status_disposal_pending.sql:ro
      - ../DB/init/08_user_status_update.sql:/docker-entrypoint-initdb.d/08_user_status_update.sql:ro
      - ../DB/init/09_notification_table.sql:/docker-entrypoint-initdb.d/09_notification_table.sql:ro
      - ../DB/init/11_asset_status_lost.sql:/docker-entrypoint-initdb.d/11_asset_status_lost.sql:ro
      - ../DB/init/12_asset_loss_requests.sql:/docker-entrypoint-initdb.d/12_asset_loss_requests.sql:ro
      - ../DB/init/13_asset_loss_remarks.sql:/docker-entrypoint-initdb.d/13_asset_loss_remarks.sql:ro
      - ../DB/init/14_transfer_location_required.sql:/docker-entrypoint-initdb.d/14_transfer_location_required.sql:ro
      - ../DB/init/15_asset_status_unused.sql:/docker-entrypoint-initdb.d/15_asset_status_unused.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - asset-network

  backend:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-asset_management}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-asset_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-9090}:9090"
    volumes:
      - uploads-data:/app/uploads
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - asset-network

  frontend:
    build:
      context: ../src/main/giic_frontend
      dockerfile: ../../../docker-deployment/Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - asset-network

networks:
  asset-network:
    driver: bridge

volumes:
  mysql-data:
  uploads-data:
