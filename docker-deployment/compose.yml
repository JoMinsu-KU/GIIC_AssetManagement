name: ${COMPOSE_PROJECT_NAME:-giic_asset}

services:
  seed-check:
    image: alpine:3.20
    restart: "no"
    volumes:
      - ./current-data:/seed:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cd /seed
        test -s database.sql
        test -s uploads.tar.gz
        test -s upload-files.sha256
        test -s seed-id.txt
        test -s seed-marker.sql
        sha256sum -c SHA256SUMS.txt

  db:
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      seed-check:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asset_management}
      MYSQL_USER: ${MYSQL_USER:-asset_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-3907}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backups:/backups
      - ./current-data/database.sql:/docker-entrypoint-initdb.d/00_database.sql:ro
      - ./current-data/seed-marker.sql:/docker-entrypoint-initdb.d/01_seed_marker.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - asset-network

  db-verify:
    image: mysql:8.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-asset_management}
    volumes:
      - ./current-data:/seed:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        expected="$$(cat /seed/seed-id.txt)"
        actual="$$(MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h db -uroot -N -s "$$MYSQL_DATABASE" -e 'SELECT seed_id FROM giic_migration_seed WHERE id = 1')"
        if [ "$$actual" != "$$expected" ]; then
          echo 'Database does not match this migration snapshot; existing data was not overwritten.' >&2
          exit 1
        fi
    networks:
      - asset-network

  uploads-seed:
    image: alpine:3.20
    restart: "no"
    depends_on:
      seed-check:
        condition: service_completed_successfully
    volumes:
      - uploads-data:/app/uploads
      - ./current-data:/seed:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        expected="$$(cat /seed/seed-id.txt)"
        if [ -f /app/uploads/.giic-seed-id ]; then
          test "$$(cat /app/uploads/.giic-seed-id)" = "$$expected"
          exit 0
        fi
        if [ -n "$$(find /app/uploads -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          echo 'Upload volume is not empty; existing images were not overwritten.' >&2
          exit 1
        fi
        tar -xzf /seed/uploads.tar.gz -C /app/uploads
        cd /app/uploads
        sha256sum -c /seed/upload-files.sha256 > /dev/null
        test "$$(find . -type f | wc -l)" -eq "$$(wc -l < /seed/upload-files.sha256)"
        chown -R 10001:10001 /app/uploads
        printf '%s\n' "$$expected" > /app/uploads/.giic-seed-id

  backend:
    build:
      context: ..
      dockerfile: docker-deployment/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db-verify:
        condition: service_completed_successfully
      uploads-seed:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Seoul
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-asset_management}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-asset_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      APP_UPLOAD_DIR: /app/uploads
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-true}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-9090}:9090"
    volumes:
      - uploads-data:/app/uploads
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9090/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - asset-network

  frontend:
    build:
      context: ../src/main/giic_frontend
      dockerfile: ../../../docker-deployment/Dockerfile.frontend
      args:
        REACT_APP_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - asset-network

networks:
  asset-network:
    driver: bridge

volumes:
  mysql-data:
  uploads-data:
