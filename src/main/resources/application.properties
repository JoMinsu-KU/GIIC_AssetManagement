spring.application.name=GIIC_Asset
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3907/asset_management?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asset_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
logging.level.root=INFO
logging.level.org.example.giic_asset=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BIND_LOG_LEVEL:WARN}
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://203.253.164.48:3000}
app.auth.cookie-secure=${APP_COOKIE_SECURE:false}

# Account notification email
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.public-url=${APP_PUBLIC_URL:http://localhost:3000}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}

server.address=0.0.0.0
server.port=${SERVER_PORT:9090}
app.client-ip.host-proxy-enabled=${APP_CLIENT_IP_HOST_PROXY_ENABLED:false}
# === 파일 업로드 설정 ===
# 단일 파일 최대 크기 (10MB)
spring.servlet.multipart.max-file-size=10MB

# 다중 이미지 업로드를 포함한 전체 요청 최대 크기
spring.servlet.multipart.max-request-size=50MB

app.upload-dir=${APP_UPLOAD_DIR:uploads}

# 파일을 디스크에 쓰기 시작하는 임계값
spring.servlet.multipart.file-size-threshold=2KB

# Multipart 활성화
spring.servlet.multipart.enabled=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent
gemini.api.timeout=30000
